name: HYDRA-UMC CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Validate project baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the baseline steps of the family
        uses: ./.github/actions/hydra-baseline
        with:
          node-checks: none
      # The Node checks keep steps of their own: the 3D meshes are fetched and verified between the setup of Node.js and its checks.
      - name: Set up Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # camera-controls 3.x declares Node.js 22 or newer.
          node-version: "22"
          cache: npm
      - name: Cache the 3D mesh package
        # The meshes are not in the repository tree: they come from one package with a pinned SHA-256
        # (meshes.pack.json). The package is kept between runs; a new revision changes the key.
        if: ${{ hashFiles('meshes.pack.json') != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/hydra-umc/meshes
          key: hydra-meshes-${{ hashFiles('meshes.pack.json') }}
      - name: Fetch and verify the 3D meshes
        # Before the type check, the tests and the production build. Every mesh is checked by its SHA-256.
        if: ${{ hashFiles('meshes.pack.json') != '' }}
        run: node scripts/mesh_pack.mjs ensure --source download
      - name: Fetch the HYDRA-UMC-SDK contracts for the route tests
        # The routes the app calls are checked against the contract and the route table generated from it. The tag is the one the
        # SDK pin tool keeps in step; without these files the two tests skip themselves.
        if: ${{ hashFiles('tests/restPaths.test.ts') != '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/hydra-umc-sdk"
          curl -fsSL --retry 3 https://github.com/JuanenRac/HYDRA-UMC-SDK/archive/refs/tags/v0.6.1.tar.gz | tar -xz --strip-components=1 -C "$RUNNER_TEMP/hydra-umc-sdk"
          echo "HYDRA_UMC_SDK_DIR=$RUNNER_TEMP/hydra-umc-sdk" >> "$GITHUB_ENV"
      - name: Validate Node.js or TypeScript project
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          npm ci --ignore-scripts
          npm run typecheck --if-present
          npm test --if-present
          npm run lint --if-present
      - name: Build the production page
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run build --if-present