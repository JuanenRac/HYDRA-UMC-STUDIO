name: HYDRA-UMC CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Validate project baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the baseline steps of the family
        uses: ./.github/actions/hydra-baseline
        with:
          node-checks: none
      # The Node checks keep steps of their own: the 3D meshes are fetched and verified between the setup of Node.js and its checks.
      - name: Set up Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # camera-controls 3.x declares Node.js 22 or newer.
          node-version: "22"
          cache: npm
      - name: Cache the 3D mesh package
        # The meshes are not in the repository tree: they come from one package with a pinned SHA-256
        # (meshes.pack.json). The package is kept between runs; a new revision changes the key.
        if: ${{ hashFiles('meshes.pack.json') != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/hydra-umc/meshes
          key: hydra-meshes-${{ hashFiles('meshes.pack.json') }}
      - name: Fetch and verify the 3D meshes
        # Before the type check, the tests and the production build. Every mesh is checked by its SHA-256.
        if: ${{ hashFiles('meshes.pack.json') != '' }}
        run: node scripts/mesh_pack.mjs ensure --source download
      - name: Fetch the HYDRA-UMC-SDK contracts for the route tests
        # The routes the app calls are checked against the contract and the route table generated from it. The tag is the one the
        # SDK pin tool keeps in step (a commit of the SDK until its next tag, which has the route of the health of the boards);
        # without these files the two tests skip themselves.
        if: ${{ hashFiles('tests/restPaths.test.ts') != '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/hydra-umc-sdk"
          curl -fsSL --retry 3 https://github.com/JuanenRac/HYDRA-UMC-SDK/archive/refs/tags/v0.7.5.tar.gz | tar -xz --strip-components=1 -C "$RUNNER_TEMP/hydra-umc-sdk"
          echo "HYDRA_UMC_SDK_DIR=$RUNNER_TEMP/hydra-umc-sdk" >> "$GITHUB_ENV"
      - name: Validate Node.js or TypeScript project
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          npm ci --ignore-scripts
          npm run typecheck --if-present
          npm test --if-present
          npm run lint --if-present
      - name: Measure the coverage of the tests and keep the floor
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          npm install --no-save --ignore-scripts @vitest/coverage-v8@^5
          npx vitest run --coverage.enabled --coverage.provider=v8 --coverage.reporter=text --coverage.reporter=text-summary --coverage.thresholds.statements=86 --coverage.thresholds.branches=79 --coverage.thresholds.functions=78 --coverage.thresholds.lines=87 > "$RUNNER_TEMP/coverage.txt" 2>&1 || status=$?
          grep -E "Tests |Test Files|Statements|Branches|Functions|Lines|All files|\.tsx? +\|" "$RUNNER_TEMP/coverage.txt" | head -400
          {
            echo "### Test coverage (report only)"
            echo '```'
            grep -E "Tests |Test Files|Statements|Branches|Functions|Lines" "$RUNNER_TEMP/coverage.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit ${status:-0}
      - name: Build the production page
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run build --if-present

  stop-visible:
    name: The STOP can always be pressed
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the server it runs with
        # A fixed commit, so a change of the server cannot turn this check red by itself.
        run: |
          git init -q ../HYDRA-UMC-SERVER
          git -C ../HYDRA-UMC-SERVER fetch -q --depth 1 https://github.com/JuanenRac/HYDRA-UMC-SERVER.git 22348c11726399a2a2e494b92fde82d875052868
          git -C ../HYDRA-UMC-SERVER checkout -q FETCH_HEAD
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Cache the 3D mesh package
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/hydra-umc/meshes
          key: hydra-meshes-${{ hashFiles('meshes.pack.json') }}
      - name: Fetch and verify the 3D meshes
        run: node scripts/mesh_pack.mjs ensure --source download
      - name: Build Studio
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Build the server
        working-directory: ../HYDRA-UMC-SERVER
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Install the browser
        run: |
          mkdir -p "$RUNNER_TEMP/playwright"
          cd "$RUNNER_TEMP/playwright"
          npm init -y >/dev/null
          npm install --ignore-scripts @playwright/test@1.64.1
          npx playwright install --with-deps chromium
      - name: Open every window and press the STOP
        env:
          PLAYWRIGHT_DIR: ${{ runner.temp }}/playwright
        run: node tools/check_stop_visible.mjs --out "$RUNNER_TEMP/stop-visible"
      - name: Keep the pictures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stop-visible
          path: ${{ runner.temp }}/stop-visible
          retention-days: 14
          if-no-files-found: warn
